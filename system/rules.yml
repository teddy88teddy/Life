# 机器可读触发器规则库（只保留有真实数据源、可确定性计算的规则）
rules:
  - id: date-reminder
    source: system/dates.yml
    kind: [renewal, deadline, custom]
    description: 按 remind 列表（如 T-30/T-7/T-1）触发期限提醒；auto_renew=true 自动升一级严重度

  - id: cooling-thaw
    source: system/dates.yml
    kind: [cooling]
    description: 按 ISO 时间戳精确计算满 hours（默认 72h）后触发冷静期解冻提醒

  - id: decision-deadline
    source: decisions/*.md
    lead_days: 7
    description: status=open 的决策在 deadline 前 7 天及逾期时触发提醒

  - id: decision-review
    source: decisions/*.md
    lead_days: 3
    description: status=decided 的决策在 review_due 前 3 天及到期时触发复盘提醒

  - id: exception-expiry
    source: compass.md
    lead_days: 3
    description: 限时例外到期前 3 天及过期时触发复核提醒

  - id: fact-stale
    source: domains/*.md
    severity: low
    description: 已确认事实的 as_of 超过 ttl_days，不单独刷屏，汇总进周报与 radar.md

  - id: pending-ai-fact
    source: domains/*.md
    max_pending_days: 7
    severity: med
    description: src=ai 且 status=pending 超过 7 天未确认，提醒确认或删除

  - id: energy-low
    source: log/*.md
    threshold: 2
    consecutive_weeks: 2
    max_gap_days: 21
    severity: med
    action: 建议未来 7 天进入恢复模式；L2 以上重大决策推迟
