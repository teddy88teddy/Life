name: Daily Proactive Radar & CI

on:
  schedule:
    # 每天北京时间 08:30（UTC 00:30）运行；周日自动发周报心跳
    - cron: "30 0 * * *"
  push:
    branches-ignore:
      - out
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run unit tests
        run: python3 -m unittest scripts/test_lifeos.py -v

      - name: Strict LifeOS validation
        id: validate
        run: python3 scripts/lifeos.py validate

      - name: Alert via ServerChan on validation failure (main / schedule)
        if: failure() && (github.event_name == 'schedule' || github.ref == 'refs/heads/main')
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python3 scripts/lifeos.py notify-failure \
            --message "LifeOS CI 校验或测试失败，请立即排查（防静默漏报）：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  proactive-run:
    needs: validate-and-test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run LifeOS engine (Issues sync + ServerChan push + out artifacts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # On push to main: refresh out/ artifacts & Issues without duplicating daily WeChat push
            python3 scripts/lifeos.py run --out-dir /tmp/lifeos-out --sync-issues
          else
            # On daily schedule or manual workflow_dispatch: full run with ServerChan notification
            python3 scripts/lifeos.py run --out-dir /tmp/lifeos-out --sync-issues --notify
          fi

      - name: Publish generated artifacts to orphan `out` branch (never touches main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TMP_WORK=/tmp/out-repo
          rm -rf "$TMP_WORK"
          mkdir -p "$TMP_WORK"
          git -C "$TMP_WORK" init -b out
          cp /tmp/lifeos-out/radar.md "$TMP_WORK/radar.md"
          cp /tmp/lifeos-out/calendar.ics "$TMP_WORK/calendar.ics"
          cp /tmp/lifeos-out/context_pack.md "$TMP_WORK/context_pack.md"
          git -C "$TMP_WORK" add -A
          git -C "$TMP_WORK" commit -m "chore(out): update radar, calendar.ics, context_pack [$(date -u +%Y-%m-%dT%H:%MZ)]"
          git -C "$TMP_WORK" remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git -C "$TMP_WORK" push --force origin out

      - name: Write diagnostic radar to Actions Summary
        run: cat /tmp/lifeos-out/radar.md >> "$GITHUB_STEP_SUMMARY"
